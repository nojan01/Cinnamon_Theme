# Standardbelegung des Plank-Docks bei der Installation (Reihenfolge von links nach rechts).
# Eine Zeile pro Eintrag:
#   docklet:<name>            -> launchers/<name>.dockitem aus diesem Ordner
#   app:<a.desktop>|<b.desktop> -> erste gefundene .desktop-Datei wird eingetragen
# Gesucht wird in ~/.local/share/applications, /usr/share/applications,
# /var/lib/flatpak/exports/share/applications und /var/lib/snapd/desktop/applications.
# Fehlt eine App, wird der Eintrag übersprungen.
docklet:applications
app:nemo.desktop
app:firefox.desktop|firefox_firefox.desktop|org.mozilla.firefox.desktop
app:org.gnome.Terminal.desktop|xfce4-terminal.desktop|mate-terminal.desktop|org.gnome.Ptyxis.desktop
# Sitzungsmenü (wird vom Installer selbst nach ~/.local/share/applications gelegt, siehe session/)
app:cinnamon-theme-session.desktop
docklet:trash
